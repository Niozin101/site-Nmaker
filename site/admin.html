<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel da loja | NMAKER</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0b09">
<link rel="icon" type="image/webp" href="imagens/logo-nmaker.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<script src="js/config.js"></script>
<style>
/* Mesmas cores do site (preto quente + laranja) */
:root {
  --bg: #0d0b09; --bg-2: #15110d; --bg-3: #1c1611;
  --surface: rgba(255, 240, 220, .04); --surface-2: rgba(255, 240, 220, .08);
  --border: rgba(255, 122, 26, .16); --border-strong: rgba(255, 122, 26, .42);
  --text: #f4efe6; --muted: #b5aa9b;
  --accent: #ff7a1a; --accent-light: #ffa24d; --accent-dark: #b8460f;
  --ok: #34d399; --erro: #f87171;
  --grad: linear-gradient(135deg, #ffa24d, #ff7a1a 50%, #b8460f);
  --radius: 14px; --t: 200ms ease;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --titulo: "Orbitron", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 15px/1.5 "Inter", system-ui, sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent-light); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Topo ---------- */
.topo {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
  padding: 10px max(16px, env(safe-area-inset-left)); background: rgba(13, 11, 9, .9); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); margin-right: auto; }
.marca svg { width: 30px; height: 32px; filter: drop-shadow(0 0 8px rgba(255, 122, 26, .5)); }
.marca strong { font-family: var(--titulo); letter-spacing: .2em; font-size: .95rem; }
.marca span { font-family: var(--mono); font-size: .72rem; color: var(--accent); text-transform: uppercase; letter-spacing: .1em; }
.ao-vivo { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.ao-vivo::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: piscar 1.6s infinite; }
@keyframes piscar { 50% { opacity: .3; } }
.usuario { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); color: #1a0d04; font-weight: 800; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px;
  border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background var(--t), border-color var(--t);
}
.btn:hover { border-color: var(--accent); background: var(--surface-2); }
.btn--primario { background: var(--grad); color: #1a0d04; border-color: transparent; }
.btn--whats { background: #25d366; color: #032312; border-color: transparent; }
.btn--sm { min-height: 34px; padding: 6px 12px; font-size: .82rem; }
.btn svg { width: 18px; height: 18px; }

/* ---------- Acesso ---------- */
.acesso { max-width: 420px; margin: 12vh auto 0; padding: 32px 24px; text-align: center; background: var(--bg-2); border: 1px solid var(--border); border-radius: 20px; }
.acesso svg.logo { width: 54px; height: 58px; margin: 0 auto 12px; filter: drop-shadow(0 0 14px rgba(255, 122, 26, .5)); }
.acesso h1 { font-family: var(--titulo); font-size: 1.3rem; margin: 0 0 8px; }
.acesso p { color: var(--muted); margin: 0 0 20px; }
.acesso form { display: grid; gap: 10px; text-align: left; margin-top: 16px; }
.campo { display: grid; gap: 4px; }
.campo label { font-size: .82rem; font-weight: 600; }
.campo input { min-height: 44px; padding: 10px 12px; border-radius: 10px; background: rgba(0, 0, 0, .35); border: 1px solid var(--border); }
.erro { color: var(--erro); font-size: .88rem; min-height: 1.2em; margin: 0; }
.ou { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .8rem; margin: 18px 0 0; }
.ou::before, .ou::after { content: ""; flex: 1; height: 1px; background: var(--border); }

/* ---------- Layout ---------- */
main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; }
.abas { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
.abas button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 14px; color: var(--muted); font-weight: 600; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.abas button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.abas .cont { font-family: var(--mono); font-size: .72rem; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); }
.abas .cont.alerta { background: var(--accent); color: #1a0d04; }
h2 { font-family: var(--titulo); font-size: 1.05rem; margin: 0 0 12px; letter-spacing: .03em; }
.caixa { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.grade { display: grid; gap: 14px; }

/* ---------- Visão geral ---------- */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 14px; }
.kpi { padding: 16px; border-radius: var(--radius); background: var(--bg-2); border: 1px solid var(--border); position: relative; overflow: hidden; }
.kpi::after { content: ""; position: absolute; right: -30px; top: -30px; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 122, 26, .18), transparent 70%); }
.kpi span { display: block; font-family: var(--mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpi strong { display: block; font-family: var(--titulo); font-size: 1.45rem; margin-top: 4px; }
.kpi small { color: var(--muted); font-size: .78rem; }
.duas { display: grid; gap: 14px; grid-template-columns: 1.6fr 1fr; }
.grafico { display: flex; align-items: flex-end; gap: 6px; height: 190px; padding-top: 10px; }
.barra { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.barra i { display: block; width: 100%; max-width: 34px; border-radius: 6px 6px 2px 2px; background: var(--grad); min-height: 3px; position: relative; }
.barra i.zero { background: var(--surface-2); }
.barra span { font-family: var(--mono); font-size: .62rem; color: var(--muted); white-space: nowrap; overflow: hidden; max-width: 100%; }
.barra:hover i::after { content: attr(data-v); position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--bg-3); border: 1px solid var(--border); padding: 2px 6px; border-radius: 6px; font-size: .7rem; white-space: nowrap; font-style: normal; }
.funil { display: grid; gap: 8px; }
.funil button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; text-align: left; }
.funil button:hover { border-color: var(--accent); }
.funil b { margin-left: auto; font-family: var(--titulo); }
.ranking { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.ranking li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; font-size: .9rem; }
.ranking li > span:first-child { font-family: var(--titulo); color: var(--accent); }
.ranking small { display: block; color: var(--muted); }
.vazio { color: var(--muted); text-align: center; padding: 30px 10px; }

/* ---------- Status ---------- */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st[data-st="0"] { color: #fbbf24; } .st[data-st="1"] { color: #60a5fa; } .st[data-st="2"] { color: var(--accent-light); }
.st[data-st="3"] { color: #a78bfa; } .st[data-st="4"] { color: var(--ok); } .st[data-st="5"] { color: var(--erro); }

/* ---------- Pedidos ---------- */
.barra-ferramentas { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.busca { flex: 1 1 260px; position: relative; }
.busca input { width: 100%; min-height: 42px; padding: 8px 12px 8px 38px; border-radius: 999px; background: rgba(0, 0, 0, .35); border: 1px solid var(--border-strong); }
.busca svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--accent); }
select.sel { min-height: 42px; padding: 8px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
select option { background: var(--bg-2); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding-bottom: 2px; }
.chips button { flex: none; min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; font-size: .82rem; font-weight: 600; }
.chips button[aria-pressed="true"] { background: var(--grad); color: #1a0d04; border-color: transparent; }
.resumo-filtro { font-family: var(--mono); font-size: .78rem; color: var(--muted); margin: 0 0 10px; }
.pedidos { display: grid; gap: 10px; }
.pedido { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.pedido.novo { animation: brilho 2.4s ease; }
@keyframes brilho { 0%, 40% { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 122, 26, .25); } }
.pedido summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 110px 1.2fr 1.4fr 110px 170px 24px; gap: 12px; align-items: center; padding: 12px 16px; }
.pedido summary::-webkit-details-marker { display: none; }
.pedido summary::after { content: "▾"; color: var(--muted); transition: transform var(--t); }
.pedido[open] summary::after { transform: rotate(180deg); }
.p-cod strong { display: block; font-family: var(--mono); }
.p-cod span, .p-cli span, .p-itens span { display: block; font-size: .76rem; color: var(--muted); }
.p-cli strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-itens { font-size: .86rem; overflow: hidden; }
.p-itens > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-total { font-family: var(--titulo); color: var(--accent-light); text-align: right; }
.p-status select { width: 100%; min-height: 36px; padding: 6px 8px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); font-size: .82rem; font-weight: 600; }
.p-status select.salvo { border-color: var(--ok); box-shadow: 0 0 0 2px rgba(52, 211, 153, .3); }
.detalhe { padding: 0 16px 16px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; border-top: 1px dashed var(--border); padding-top: 14px; }
.detalhe h3 { font-family: var(--mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.detalhe table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.detalhe td { padding: 5px 0; border-bottom: 1px solid var(--border); }
.detalhe td:last-child { text-align: right; white-space: nowrap; }
.detalhe tfoot td { border: 0; font-weight: 700; padding-top: 8px; }
.contato p { margin: 0 0 6px; font-size: .88rem; }
.contato .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* lista curta da visão geral: sempre no formato compacto */
.compacto .pedido summary { grid-template-columns: 1fr auto; grid-template-areas: "cod total" "cli status" "itens itens"; row-gap: 6px; }
.compacto .pedido summary::after { display: none; }
.compacto .p-cod { grid-area: cod; } .compacto .p-cli { grid-area: cli; } .compacto .p-itens { grid-area: itens; }
.compacto .p-total { grid-area: total; } .compacto .p-status { grid-area: status; min-width: 170px; }
.compacto .detalhe { grid-template-columns: 1fr; }

.pg-info { font-size: .8rem; color: var(--muted); margin: 8px 0 0; }
.pg-alerta { font-size: .82rem; color: var(--erro); font-weight: 700; margin: 6px 0 0; }

/* ---------- Clientes ---------- */
.tabela { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tabela th { text-align: left; font-family: var(--mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px; border-bottom: 1px solid var(--border-strong); cursor: pointer; white-space: nowrap; }
.tabela td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tabela td small { display: block; color: var(--muted); }
.tabela tr:hover td { background: var(--surface); }
.num { text-align: right; white-space: nowrap; }

/* ---------- Conversas (chat do site) ---------- */
.conv { display: grid; grid-template-columns: 320px 1fr; gap: 14px; height: calc(100dvh - 190px); min-height: 420px; }
.conv > * { min-width: 0; min-height: 0; }
.conv__lista { padding: 6px; overflow-y: auto; }
.conv__item { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left; }
.conv__item:hover { background: var(--surface); }
.conv__item[aria-current="true"] { background: var(--surface-2); }
.conv__item strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv__item time { font-family: var(--mono); font-size: .68rem; color: var(--muted); }
.conv__item span { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv__item.nao-lida strong::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%; background: var(--accent); vertical-align: middle; }
.conv__item.nao-lida span { color: var(--text); font-weight: 600; }
.conv__aberta { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.conv__topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.conv__topo div { flex: 1; min-width: 0; }
.conv__topo small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.conv__voltar { display: none; }
.conv__msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.cmsg { max-width: 78%; padding: 9px 12px; border-radius: 14px; font-size: .92rem; }
.cmsg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.cmsg time { display: block; margin-top: 3px; font-size: .68rem; opacity: .7; text-align: right; }
.cmsg--cliente { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.cmsg--loja { align-self: flex-end; background: var(--accent); color: #1a0d04; border-bottom-right-radius: 4px; }
.conv__form { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; border-top: 1px solid var(--border); }
.conv__form textarea { flex: 1; resize: none; min-height: 44px; max-height: 140px; overflow-y: hidden; padding: 10px 12px; border-radius: 12px; background: rgba(0, 0, 0, .35); border: 1px solid var(--border); color: var(--text); font: inherit; }
.conv__form textarea:focus { outline: none; border-color: var(--accent); }
@media (max-width: 900px) {
  .conv { grid-template-columns: 1fr; height: auto; }
  .conv__lista { max-height: none; }
  .conv.com-aberta .conv__lista { display: none; }
  .conv:not(.com-aberta) .conv__aberta { display: none; }
  .conv__aberta { height: calc(100dvh - 160px); }
  .conv__voltar { display: inline-flex; }
}

.aviso { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); opacity: 0; z-index: 50; padding: 12px 18px; border-radius: 999px; background: var(--bg-3); border: 1px solid var(--accent); box-shadow: 0 0 24px rgba(255, 122, 26, .35); font-weight: 600; transition: all var(--t); pointer-events: none; }
.aviso.mostrar { opacity: 1; transform: translate(-50%, 0); }
.demo { font-family: var(--mono); font-size: .72rem; background: var(--accent-light); color: #1a0d04; padding: 4px 10px; border-radius: 6px; }

/* ---------- Celular ---------- */
@media (max-width: 900px) {
  .duas { grid-template-columns: 1fr; }
  .pedido summary { grid-template-columns: 1fr auto; grid-template-areas: "cod total" "cli cli" "itens itens" "status status"; row-gap: 6px; }
  .pedido summary::after { display: none; }
  .p-cod { grid-area: cod; } .p-cli { grid-area: cli; } .p-itens { grid-area: itens; } .p-total { grid-area: total; } .p-status { grid-area: status; }
  .detalhe { grid-template-columns: 1fr; }
  .tabela thead { display: none; }
  .tabela tr { display: grid; grid-template-columns: 1fr auto; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .tabela td { border: 0; padding: 2px 4px; }
  .usuario span.nome, .ao-vivo { display: none; }
}
@media (max-width: 480px) { .marca span { display: none; } .kpi strong { font-size: 1.2rem; } .topo .btn span { display: none; } }
/* nada pode alargar a página no celular */
.duas > *, .grade > *, .caixa { min-width: 0; }
.marca { min-width: 0; }
@media (max-width: 600px) {
  .topo { gap: 8px; }
  .demo { font-size: .62rem; padding: 3px 6px; }
  .grafico { gap: 3px; height: 160px; }
  .barra span { font-size: .55rem; }
  .barra:nth-child(even) span { visibility: hidden; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .kpis .kpi:last-child { grid-column: 1 / -1; }
  main { padding: 14px 12px 50px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa24d"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#d9590f"/></linearGradient>
    <symbol id="i-logo" viewBox="17 50 270 278">
      <path d="M23 72.7 L64.2 58 L228 237.8 L228 73.5 L275.8 73.5 L275.8 306 L235 320 L71.3 137.8 L71.3 320 L23 320 Z" fill="#8a3208" transform="translate(8 6)"/>
      <path d="M23 72.7 L64.2 58 L228 237.8 L228 73.5 L275.8 73.5 L275.8 306 L235 320 L71.3 137.8 L71.3 320 L23 320 Z" fill="url(#logoGrad)"/>
    </symbol>
    <symbol id="i-busca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>

    <symbol id="i-baixar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-copiar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
    <symbol id="i-site" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  </defs>
</svg>

<header class="topo">
  <a class="marca" href="index.html"><svg aria-hidden="true"><use href="#i-logo"/></svg><div><strong>NMAKER</strong><br><span>Painel da loja</span></div></a>
  <span class="ao-vivo" id="aoVivo" hidden>Ao vivo</span>
  <span class="demo" id="selDemo" hidden>Demonstração</span>
  <div class="usuario" id="usuario" hidden></div>
  <a class="btn btn--sm" href="index.html"><svg aria-hidden="true"><use href="#i-site"/></svg><span>Ver site</span></a>
</header>

<!-- Tela de acesso (só o dono entra) -->
<section class="acesso" id="acesso" hidden>
  <svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg>
  <h1>Painel da loja</h1>
  <p id="acessoTexto">Entre com a conta do dono da loja.</p>
  <button type="button" class="btn btn--primario" id="btnGoogle" style="width:100%">Entrar com Google</button>
  <div class="ou">ou com e-mail</div>
  <form id="formEntrar" novalidate>
    <div class="campo"><label for="aEmail">E-mail</label><input id="aEmail" type="email" autocomplete="email" required></div>
    <div class="campo"><label for="aSenha">Senha</label><input id="aSenha" type="password" autocomplete="current-password" required></div>
    <p class="erro" id="acessoErro" role="alert"></p>
    <button type="submit" class="btn">Entrar</button>
  </form>
  <button type="button" class="btn btn--sm" id="btnSairAcesso" hidden style="margin-top:12px">Sair e entrar com outra conta</button>
</section>

<main id="app" hidden>
  <div class="abas" role="tablist">
    <button type="button" role="tab" data-aba="geral" aria-selected="true">Visão geral</button>
    <button type="button" role="tab" data-aba="pedidos" aria-selected="false">Pedidos <span class="cont" id="contAbertos">0</span></button>
    <button type="button" role="tab" data-aba="clientes" aria-selected="false">Clientes <span class="cont" id="contClientes">0</span></button>
    <button type="button" role="tab" data-aba="conversas" aria-selected="false">Conversas <span class="cont" id="contConversas">0</span></button>
  </div>

  <!-- VISÃO GERAL -->
  <section data-painel="geral">
    <div class="kpis" id="kpis"></div>
    <div class="duas">
      <div class="caixa">
        <h2>Vendas dos últimos 14 dias</h2>
        <div class="grafico" id="grafico" role="img" aria-label="Gráfico de vendas por dia"></div>
      </div>
      <div class="caixa">
        <h2>Pedidos por status</h2>
        <div class="funil" id="funil"></div>
      </div>
    </div>
    <div class="duas" style="margin-top:14px">
      <div class="caixa">
        <h2>Últimos pedidos</h2>
        <div class="pedidos compacto" id="ultimos"></div>
      </div>
      <div class="caixa">
        <h2>Mais vendidos</h2>
        <ol class="ranking" id="ranking"></ol>
      </div>
    </div>
  </section>

  <!-- PEDIDOS -->
  <section data-painel="pedidos" hidden>
    <div class="barra-ferramentas">
      <label class="busca"><span class="visually-hidden">Buscar pedidos</span>
        <svg aria-hidden="true"><use href="#i-busca"/></svg>
        <input id="buscaPedidos" type="search" placeholder="Buscar por cliente, código, produto, cidade...">
      </label>
      <select class="sel" id="periodo" aria-label="Período">
        <option value="tudo">Todo o período</option>
        <option value="hoje">Hoje</option>
        <option value="7">Últimos 7 dias</option>
        <option value="30">Últimos 30 dias</option>
        <option value="mes">Este mês</option>
      </select>
      <button type="button" class="btn" id="exportar"><svg aria-hidden="true"><use href="#i-baixar"/></svg>Exportar planilha</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por status"></div>
    <p class="resumo-filtro" id="resumoFiltro"></p>
    <div class="pedidos" id="listaPedidos"></div>
  </section>

  <!-- CLIENTES -->
  <section data-painel="clientes" hidden>
    <div class="barra-ferramentas">
      <label class="busca"><span class="visually-hidden">Buscar clientes</span>
        <svg aria-hidden="true"><use href="#i-busca"/></svg>
        <input id="buscaClientes" type="search" placeholder="Buscar por nome, e-mail, telefone, cidade...">
      </label>
    </div>
    <div class="caixa" style="padding:6px 10px">
      <table class="tabela">
        <thead><tr>
          <th data-ord="nome">Cliente</th><th data-ord="contato">Contato</th><th data-ord="cidade">Cidade</th>
          <th data-ord="pedidos" class="num">Pedidos</th><th data-ord="gasto" class="num">Total gasto</th><th data-ord="desde" class="num">Cliente desde</th>
        </tr></thead>
        <tbody id="listaClientes"></tbody>
      </table>
    </div>
  </section>

  <!-- CONVERSAS (chat do site) -->
  <section data-painel="conversas" hidden>
    <div class="conv">
      <div class="conv__lista caixa" id="convLista" aria-label="Conversas"></div>
      <div class="conv__aberta caixa" id="convAberta"><p class="vazio">Escolha uma conversa para responder.</p></div>
    </div>
  </section>
</main>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
